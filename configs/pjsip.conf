; ============================================================================
; PJSIP CONFIGURATION: NETWORK TRANSPORTS & ENDPOINT DEFINITIONS
; ============================================================================

; ----------------------------------------------------------------------------
; 1. NETWORK TRANSPORTS
; Defines how the SBC listens for incoming SIP traffic.
; ----------------------------------------------------------------------------
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=<YOUR_VPC_SUBNET>                 ; Internal AWS VPC range
external_media_address=<YOUR_STATIC_IP>     ; Public AWS Elastic IP for audio
external_signaling_address=<YOUR_STATIC_IP> ; Public AWS Elastic IP for SIP

; ----------------------------------------------------------------------------
; 1. NETWORK TRANSPORTS
; Defines how the SBC listens for incoming SIP traffic.
; ----------------------------------------------------------------------------
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=<YOUR_VPC_SUBNET>                 ; Internal AWS VPC range
external_media_address=<YOUR_STATIC_IP>     ; Public AWS Elastic IP for audio
external_signaling_address=<YOUR_STATIC_IP> ; Public AWS Elastic IP for SIP

; ==========================================
; 2. PRIMARY PBX TRUNK (Source System)
; Defines the connection to your internal call center / PBX.
; ==========================================
[source_pbx]
type=endpoint
transport=transport-udp
context=from-source                      ; Where to send calls in extensions.conf 
disallow=all                             ; Security best practice: block all codecs first
allow=ulaw,alaw                          ; Only allow standard high-quality G.711
direct_media=no                          ; Force media through SBC for IP masking 
aors=source_aor

[source_aor]                             ; Address of Record (The IP we send calls to)
type=aor
contact=sip:<PBX_IP_OR_DOMAIN>:5060      ; IP of the Internal PBX   

[source_identify]                        ; Security: Restricts access to specific IPs
type=identify
endpoint=source_pbx
match=<PBX_IP_OR_DOMAIN>                 ; Only allow traffic from this IP

; ==========================================
; 3. EXTERNAL VOICE AGENT TRUNK (AI/IVR Vendor)
; Defines the connection to the Third-Party Voice AI platform.
; ==========================================
[external_voice_agent]
type=endpoint
transport=transport-udp
context=from-external-agent              ; Dialplan context for returning calls
disallow=all
allow=ulaw,alaw
direct_media=no
aors=agent_aor                           ; <--- FIXED: Matched to agent_aor below

[agent_aor]
type=aor
contact=sip:<AGENT_IP_OR_DOMAIN>:5060    ; The SIP endpoint for the AI Vendor

[agent_identify]                         ; Security: Identify incoming calls from the AI
type=identify
endpoint=external_voice_agent
match=<AGENT_IP_OR_DOMAIN>               ; Only allow traffic from the AI Vendor