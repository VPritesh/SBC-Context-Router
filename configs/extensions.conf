; ============================================================================
; DIALPLAN: SMART CONTEXT ROUTING & MEMORY LOGIC
; ============================================================================

[from-source]
; ----------------------------------------------------------------------------
; 1. FORWARD TO VOICE AGENT & SAVE CONTEXT
; These blocks capture the campaign intent BEFORE forwarding the call.
; ----------------------------------------------------------------------------

; ----------------------------------------------------------------------------
; 1. PREFIX-BASED ROUTING (e.g., _DEPT1_1234)
; Best for identifying specific departments via a prepended string.
; ----------------------------------------------------------------------------
exten => _DEPT1_.,1,NoOp(Forwarding to Voice Agent - Saving Memory for: ${CALLERID(num)}) 
 ; Save the Target Queue to the SQLite DB using CallerID as the Key 
 same => n,Set(DB(escalation/${CALLERID(num)})=<CAMPAIGN_1_QUEUE_ID>) 
 ; Forward the call to the Voice AI platform 
 same => n,Dial(PJSIP/<AI_TARGET_NUMBER>@external_voice_agent) 
 same => n,Hangup()

; ----------------------------------------------------------------------------
; 2. SUFFIX-BASED ROUTING (e.g., 1234_DPR)
; Useful if the source system appends a department code to the end.
; ----------------------------------------------------------------------------
exten => _.[_]DPR,1,NoOp(Suffix Match: DPR - Saving Memory: ${CALLERID(num)})
 same => n,Set(DB(escalation/${CALLERID(num)})=<CAMPAIGN_DPR_QUEUE>)
 same => n,Dial(PJSIP/<AI_TARGET>@external_voice_agent)
 same => n,Hangup()

; ----------------------------------------------------------------------------
; 3. STANDARD 10/11-DIGIT ROUTING (No Alpha Characters)
; Handles standard North American numbers directly (e.g., 17178998034).
; ----------------------------------------------------------------------------
; Matches 11-digit numbers starting with 1 (e.g., 18005551212)
exten => _1NXXNXXXXXX,1,NoOp(11-Digit Match: Saving Memory for: ${CALLERID(num)}) 
 same => n,Set(DB(escalation/${CALLERID(num)})=<GENERAL_QUEUE>) 
 same => n,Dial(PJSIP/<AI_TARGET>@external_voice_agent) 
 same => n,Hangup()

 ; Matches 10-digit numbers (e.g., 1112223344)
exten => _NXXNXXXXXX,1,NoOp(10-Digit Match: Saving Memory for: ${CALLERID(num)})
 same => n,Set(DB(escalation/${CALLERID(num)})=<GENERAL_QUEUE>)
 same => n,Dial(PJSIP/<AI_TARGET>@external_voice_agent) 
 same => n,Hangup()


[from-external-agent]
; ----------------------------------------------------------------------------
; 2. ESCALATION: RETRIEVE FROM MEMORY
; This context is triggered when the Voice AI transfers a call back.
; ----------------------------------------------------------------------------

; The Voice AI sends the call to 'escalate'
exten => escalate,1,NoOp(Voice Agent Escalation - Retrieving Original Context) 
 ; Query the database for the CallerID's original destination 
 same => n,Set(TARGET_DEST=${DB(escalation/${CALLERID(num)})})
 ; Check if a memory record exists; if not, go to the default backup 
 same => n,GotoIf($["${TARGET_DEST}" != ""]?route_it) 
 
 ; FAILURE CASE: No memory found, send to a general human queue 
 same => n,NoOp(No Memory Record Found! Using Backup Queue.) 
 same => n,Dial(PJSIP/<DEFAULT_BACKUP_QUEUE>@source_pbx) 
 same => n,Hangup()
 
 ; SUCCESS CASE: Memory found, route to the original department 
 same => n(route_it),NoOp(Routing back to Original Campaign: ${TARGET_DEST}) 
 same => n,Dial(PJSIP/${TARGET_DEST}@source_pbx) 
 ; Cleanup: Delete the record from SQLite to free up memory 
 same => n,NoOp(${DB_DELETE(escalation/${CALLERID(num)})}) 
 same => n,Hangup()

; ----------------------------------------------------------------------------
; 3. CATCH-ALL FOR DIRECT NUMBER DIALING
; Handles cases where the AI dials 10 or 11 digits directly instead of 'escalate'.
; ----------------------------------------------------------------------------
exten => _[0-9].,1,NoOp(Direct Dialing Detected - Intercepting for Context Recovery) 
 same => n,Goto(escalate,1) ; Redirect to the 'escalate' logic above 